version: 1
backend:
  phases:
    build:
      commands:
        # Use --include=optional to ensure optional deps like @parcel/watcher are installed
        - npm ci --include=optional --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    build:
      commands:
        # Use --include=optional to ensure optional deps
        - npm ci --include=optional

        # Run build
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
